name: 'sales_analytics'
version: '1.0.0'
profile: 'sales_analytics'
require-dbt-version: [">=1.9.0", "<2.0.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  sales_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  sales_analytics:
    +schema: raw
    raw_customers:
      +column_types:
        is_test_account: boolean
    raw_orders:
      +column_types:
        order_date: date
        quantity: integer
    raw_products:
      +column_types:
        unit_price: 'decimal(10,2)'
